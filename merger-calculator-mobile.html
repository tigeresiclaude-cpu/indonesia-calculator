<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
  <title>Indonesia – Merger Calculator</title>
  <meta name="description" content="เครื่องคำนวณราคาประมูลควบรวมบริษัท (Phase 3 Merger) สำหรับบอร์ดเกม Indonesia ฉบับที่ 3"/>
  <meta name="theme-color" content="#232e10"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Merger"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="assets/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/mobile.css"/>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
</svg>

<div class="app">

  <header class="topbar">
    <span class="tb-mark">◆</span>
    <span class="tb-title">Indonesia</span>
    <span class="tb-sub">Merger · Phase 3</span>
  </header>

  <main class="content">

    <div class="badge normal" id="badge" role="status">Normal Merger</div>

    <!-- บริษัท A / B -->
    <div class="co-row">
      <section class="card co">
        <div class="co-tag">บริษัท A</div>
        <button class="good-btn" type="button" data-good="a" aria-label="เลือกประเภทสินค้าบริษัท A">
          <i class="swatch" id="dot-a"></i>
          <span class="good-name" id="good-a">ข้าว</span>
          <span class="good-val" id="val-a">20</span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <div class="stepper">
          <button class="st" type="button" data-step="a" data-delta="-1" aria-label="ลดจำนวนสินค้าบริษัท A">−</button>
          <input class="cnt" id="goods-a" type="number" inputmode="numeric" min="1" max="30" value="3" aria-label="จำนวนสินค้าบริษัท A"/>
          <button class="st" type="button" data-step="a" data-delta="1" aria-label="เพิ่มจำนวนสินค้าบริษัท A">+</button>
        </div>
      </section>

      <section class="card co">
        <div class="co-tag">บริษัท B</div>
        <button class="good-btn" type="button" data-good="b" aria-label="เลือกประเภทสินค้าบริษัท B">
          <i class="swatch" id="dot-b"></i>
          <span class="good-name" id="good-b">ข้าว</span>
          <span class="good-val" id="val-b">20</span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <div class="stepper">
          <button class="st" type="button" data-step="b" data-delta="-1" aria-label="ลดจำนวนสินค้าบริษัท B">−</button>
          <input class="cnt" id="goods-b" type="number" inputmode="numeric" min="1" max="30" value="5" aria-label="จำนวนสินค้าบริษัท B"/>
          <button class="st" type="button" data-step="b" data-delta="1" aria-label="เพิ่มจำนวนสินค้าบริษัท B">+</button>
        </div>
      </section>
    </div>

    <!-- ตัวเลขหลัก -->
    <section class="card hero-num">
      <div class="hn-lbl">Nominal · ราคาเปิดขั้นต่ำ</div>
      <div class="hn-row">
        <div class="hn-val num" id="res-nominal">—</div>
        <div class="hn-inc num">+<span id="res-increment">—</span><small>/ขั้น</small></div>
      </div>
      <div class="hn-formula" id="formula"></div>
    </section>

    <!-- ขั้นบันไดราคา -->
    <section class="ladder-wrap">
      <div class="sec-lbl" id="ladder-lbl">ขั้นบันไดการประมูล · แตะเพื่อเลือก</div>
      <div class="ladder" id="ladder"></div>
    </section>

    <!-- ราคาที่ชนะ + ส่วนแบ่ง -->
    <section class="card payout" id="payout">
      <button class="bid-row" type="button" id="bid-tap">
        <span class="br-lbl">ราคาที่ชนะ</span>
        <span class="br-val num" id="bid-display">—</span>
        <svg class="chev"><use href="#i-chev"/></svg>
      </button>
      <div class="split-row">
        <div class="sp">
          <div class="sp-lbl">A · <span id="sp-pct-a">—%</span></div>
          <div class="sp-amt num" id="sp-amt-a">—</div>
          <div class="sp-who" id="sp-who-a">—</div>
        </div>
        <div class="sp">
          <div class="sp-lbl">B · <span id="sp-pct-b">—%</span></div>
          <div class="sp-amt num" id="sp-amt-b">—</div>
          <div class="sp-who" id="sp-who-b">—</div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- เลือกประเภทสินค้า -->
<div class="sheet-overlay" id="sheet-overlay" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-title" id="sheet-title">เลือกประเภทสินค้า</div>
    <div class="sheet-list" id="sheet-list"></div>
  </div>
</div>

<!-- เลือกราคา bid -->
<div class="picker-overlay" id="picker-overlay" role="dialog" aria-modal="true" aria-labelledby="picker-title">
  <div class="picker-modal">
    <div class="picker-header">
      <button class="picker-btn cancel" type="button" data-picker-cancel>ยกเลิก</button>
      <span class="picker-title" id="picker-title">Bid</span>
      <button class="picker-btn confirm" type="button" data-picker-confirm>ยืนยัน</button>
    </div>
    <div class="picker-body">
      <div class="picker-center-bar"></div>
      <div class="picker-drum" id="picker-drum"></div>
    </div>
  </div>
</div>

<script src="assets/js/merger-core.js"></script>
<script src="assets/js/picker.js"></script>
<script src="assets/js/sheet.js"></script>
<script src="assets/js/app-mobile.js"></script>
</body>
</html>
